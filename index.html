    <!-- iPhone: po dodaniu do ekranu początkowego pełny ekran, treść pod przezroczystym paskiem stanu
         (górny pasek aplikacji w kolorze kategorii odsuwa się o env(safe-area-inset-top)). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IdeaTree" />
    <meta name="format-detection" content="telephone=no" />
    <title>IdeaTree</title>
    <script>
      // Ustaw motyw przed pierwszym renderem, aby uniknąć migotania.
      (function () {
        try {
          var t = localStorage.getItem('ideatree-theme') || 'light';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.classList.add('cat-none');
        } catch (e) {}
      })();
    </script>
